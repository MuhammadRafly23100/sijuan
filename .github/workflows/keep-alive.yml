name: Keep alive

# Paket gratis Supabase mem-pause database yang tidak aktif sekitar seminggu.
# Membuka /login setiap hari menyentuh database (sesi disimpan di sana), sehingga
# demo tidak sempat tidur. Jika situs tidak membalas 200, job gagal dan GitHub
# mengirim email, jadi workflow ini sekaligus menjadi pengingat kalau demo mati.
#
# ponytail: tidak ada jaminan dari Supabase bahwa ini dihitung sebagai aktivitas,
# dan GitHub menonaktifkan workflow terjadwal di repo publik yang tidak ada
# aktivitasnya selama 60 hari. Kalau salah satunya terjadi, jalankan ulang manual
# lewat tab Actions (Run workflow) atau ganti ke layanan ping eksternal.

on:
  schedule:
    - cron: '17 3 * * *' # tiap hari 03:17 UTC (10:17 WIB)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Buka halaman login
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 30 --retry-all-errors \
            --max-time 60 --output /dev/null \
            --write-out 'status %{http_code} dalam %{time_total}s\n' \
            https://sijuan.vercel.app/login
